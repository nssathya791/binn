id: sensitive-info-disclosure

info:
  name: Sensitive Information Disclosure
  author: wf-recon-toolkit
  severity: medium
  description: Detects sensitive data exposure in responses including internal IPs, stack traces, debug info
  tags: exposure,information-disclosure,debug

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/debug"
      - "{{BaseURL}}/trace"
      - "{{BaseURL}}/error"
      - "{{BaseURL}}/404notfound"
      - "{{BaseURL}}/test"
      - "{{BaseURL}}/info"
      - "{{BaseURL}}/status"
      - "{{BaseURL}}/health"
      - "{{BaseURL}}/server-status"
      - "{{BaseURL}}/server-info"
      - "{{BaseURL}}/phpinfo.php"
      - "{{BaseURL}}/elmah.axd"
      - "{{BaseURL}}/web.config"
      - "{{BaseURL}}/crossdomain.xml"

    stop-at-first-match: false
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 500

      - type: regex
        part: body
        regex:
          - '(?i)(stack\s*trace|traceback|exception\s+in|error\s+at\s+line)'
          - '(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3})'
          - '(?i)(jdbc:|mongodb://|redis://|amqp://|mysql://|postgres://)'
          - '(?i)(AWS_ACCESS_KEY|AKIA[0-9A-Z]{16})'
          - '(?i)(BEGIN\s+(RSA|DSA|EC|OPENSSH)\s+PRIVATE\s+KEY)'
          - '(?i)(phpinfo\(\)|PHP Version)'
          - '(?i)(server\.xml|web\.config|applicationhost\.config)'
        condition: or

    extractors:
      - type: regex
        part: body
        group: 0
        regex:
          - '10\.\d{1,3}\.\d{1,3}\.\d{1,3}'
          - '172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}'
          - '192\.168\.\d{1,3}\.\d{1,3}'
          - 'AKIA[0-9A-Z]{16}'
