id: exposed-env-file

info:
  name: Exposed Environment File
  author: wf-recon-toolkit
  severity: high
  description: Detects exposed .env files containing secrets, API keys, database credentials
  tags: exposure,env,secrets,misconfiguration

http:
  - method: GET
    path:
      - "{{BaseURL}}/.env"
      - "{{BaseURL}}/.env.local"
      - "{{BaseURL}}/.env.production"
      - "{{BaseURL}}/.env.staging"
      - "{{BaseURL}}/.env.development"
      - "{{BaseURL}}/.env.backup"
      - "{{BaseURL}}/env"
      - "{{BaseURL}}/application.properties"
      - "{{BaseURL}}/application.yml"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - "DB_PASSWORD"
          - "DATABASE_URL"
          - "API_KEY"
          - "SECRET_KEY"
          - "AWS_ACCESS_KEY"
          - "PRIVATE_KEY"
          - "smtp"
          - "password="
          - "spring.datasource"
          - "jdbc:"
        condition: or

      - type: word
        words:
          - "<html"
          - "<HTML"
          - "<!DOCTYPE"
        negative: true

    extractors:
      - type: regex
        part: body
        regex:
          - '(?i)(api[_-]?key|secret|password|token|auth|credential)[=:]\s*["\']?([^\s"\']+)'
