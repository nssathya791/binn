id: js-secrets-exposure

info:
  name: Secrets in JavaScript Files
  author: wf-recon-toolkit
  severity: high
  description: Scans JavaScript files for hardcoded API keys, tokens, secrets, and internal endpoints
  tags: exposure,js,secrets,api-key

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - "javascript"
          - "application/js"
          - "text/js"
        condition: or

    extractors:
      # AWS Keys
      - type: regex
        part: body
        name: aws-key
        regex:
          - '(?:AKIA|ASIA)[0-9A-Z]{16}'

      # Generic API keys
      - type: regex
        part: body
        name: api-key
        regex:
          - '(?i)(?:api[_-]?key|apikey|api_secret)["\s:=]+["\']([a-zA-Z0-9_\-]{20,})["\']'

      # JWT tokens
      - type: regex
        part: body
        name: jwt
        regex:
          - 'eyJ[a-zA-Z0-9_-]+\.eyJ[a-zA-Z0-9_-]+\.[a-zA-Z0-9_-]+'

      # Bearer tokens
      - type: regex
        part: body
        name: bearer-token
        regex:
          - '(?i)bearer\s+[a-zA-Z0-9_\-.]+\.[a-zA-Z0-9_\-.]+\.[a-zA-Z0-9_\-.]+'

      # Internal URLs/endpoints
      - type: regex
        part: body
        name: internal-url
        regex:
          - 'https?://(?:10\.\d+\.\d+\.\d+|172\.(?:1[6-9]|2\d|3[01])\.\d+\.\d+|192\.168\.\d+\.\d+)[:/][^\s"'']+'

      # OAuth/Auth endpoints
      - type: regex
        part: body
        name: auth-endpoint
        regex:
          - '(?i)(?:client_secret|client_id|oauth|auth_token)["\s:=]+["\']([a-zA-Z0-9_\-]{10,})["\']'

      # Database connection strings
      - type: regex
        part: body
        name: db-connection
        regex:
          - '(?i)(?:mongodb|postgres|mysql|redis|amqp)://[^\s"''<>]+'

      # Private keys
      - type: regex
        part: body
        name: private-key
        regex:
          - '-----BEGIN (?:RSA |EC |DSA )?PRIVATE KEY-----'

      # Hardcoded passwords
      - type: regex
        part: body
        name: password
        regex:
          - '(?i)(?:password|passwd|pwd)["\s:=]+["\']([^"'']{6,})["\']'

      # Google API keys
      - type: regex
        part: body
        name: google-api
        regex:
          - 'AIza[0-9A-Za-z_-]{35}'

      # Slack tokens
      - type: regex
        part: body
        name: slack-token
        regex:
          - 'xox[baprs]-[0-9a-zA-Z-]+'

      # Internal API paths
      - type: regex
        part: body
        name: internal-api
        regex:
          - '["'']/(?:internal|admin|private|hidden|debug|management)/api/[a-zA-Z0-9/_-]+["'']'
